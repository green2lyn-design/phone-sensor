

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기울기 공 게임</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
body {
  margin: 0;
  background: #101827;
  color: white;
  font-family: sans-serif;
  text-align: center;
}
main { padding: 20px; }
#room {
  font-size: 30px;
  color: skyblue;
  font-weight: bold;
  overflow-wrap: anywhere;
}
#status { margin: 15px; }
canvas {
  width: 95%;
  max-width: 800px;
  background: #203a50;
  border: 2px solid white;
  border-radius: 15px;
}
</style>
</head>
<body>
<main>
<h1>🎮 기울기 공 게임</h1>
<p>아이폰에서 아래 연결 코드를 입력하세요.</p>
<div id="status">연결 준비 중...</div>
<div id="room">연결 중...</div>
<canvas id="game" width="800" height="430"></canvas>
<p id="score">점수: 0</p>
</main>

<script>
const statusEl = document.getElementById("status");
const roomEl = document.getElementById("room");

const peer = new Peer();

let tilt = 0;
let jumpQueued = false;
let score = 0;
let gameOver = false;

peer.on("open", id => {
  roomEl.textContent = id;
  statusEl.textContent = "아이폰 연결을 기다리는 중";
});

peer.on("connection", conn => {
  statusEl.textContent = "아이폰 연결 완료!";

  conn.on("data", data => {
    if (data.type === "control") {
      tilt = Math.max(-1, Math.min(1, data.tilt));
      if (data.jump) jumpQueued = true;
      if (data.restart) reset();
    }
  });

  conn.on("close", () => {
    statusEl.textContent = "연결이 끊어졌어요.";
  });
});

peer.on("error", error => {
  statusEl.textContent = "연결 오류: " + error.type;
});

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const ground = 350;

let ball;
let obstacles;

function reset() {
  ball = {
    x: 90, y: ground - 17,
    vx: 0, vy: 0, r: 17
  };

  obstacles = [
    { x: 430, w: 34, h: 62 },
    { x: 700, w: 34, h: 85 }
  ];

  score = 0;
  gameOver = false;
  document.getElementById("score").textContent = "점수: 0";
}

function draw() {
  ctx.clearRect(0, 0, 800, 430);

  ctx.fillStyle = "#35536a";
  ctx.fillRect(0, ground, 800, 80);

  obstacles.forEach(o => {
    ctx.fillStyle = "#fb923c";
    ctx.fillRect(o.x, ground - o.h, o.w, o.h);
  });

  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fillStyle = "#38bdf8";
  ctx.fill();

  ctx.fillStyle = "white";
  ctx.font = "20px sans-serif";
  ctx.fillText("점수: " + score, 20, 30);

  if (gameOver) {
    ctx.fillStyle = "rgba(0,0,0,.7)";
    ctx.fillRect(0, 0, 800, 430);

    ctx.fillStyle = "white";
    ctx.font = "bold 42px sans-serif";
    ctx.fillText("게임 종료!", 300, 190);
    ctx.font = "22px sans-serif";
    ctx.fillText("아이폰에서 다시 시작을 눌러주세요", 190, 235);
  }
}

function frame() {
  if (!gameOver) {
    ball.vx += tilt * 0.42;
    ball.vx *= 0.91;
    ball.vx = Math.max(-7, Math.min(7, ball.vx));
    ball.x += ball.vx;

    ball.x = Math.max(ball.r, Math.min(800 - ball.r, ball.x));

    if (jumpQueued && ball.y >= ground - ball.r - 1) {
      ball.vy = -12;
    }

    jumpQueued = false;

    ball.vy += 0.55;
    ball.y += ball.vy;

    if (ball.y > ground - ball.r) {
      ball.y = ground - ball.r;
      ball.vy = 0;
    }

    obstacles.forEach(o => {
      o.x -= 3.2;

      if (o.x + o.w < 0) {
        o.x = 800 + Math.random() * 180;
        o.h = 45 + Math.random() * 55;
        score++;
        document.getElementById("score").textContent =
          "점수: " + score;
      }

      if (
        ball.x + ball.r > o.x &&
        ball.x - ball.r < o.x + o.w &&
        ball.y + ball.r > ground - o.h
      ) {
        gameOver = true;
      }
    });
  }

  draw();
  requestAnimationFrame(frame);
}

reset();
frame();
</script>
</main>
</body>
</html>
